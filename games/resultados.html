<!DOCTYPE html>
<html lang="es" data-base="../">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultados · Zona Segura</title>
  <meta name="theme-color" content="#12161b">
  <link rel="icon" type="image/png" href="../assets/images/logo-sena.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,700..900&family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/resultados.css">
</head>
<body>
  <div class="page">
    <main class="page__main" id="main">

      <section class="res-hero" aria-labelledby="res-title">
        <div class="gauge">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs><linearGradient id="gauge-grad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#39a900"/><stop offset="1" stop-color="#ffc400"/></linearGradient></defs>
            <circle class="track" cx="100" cy="100" r="84"/>
            <circle class="prog" id="gauge-prog" cx="100" cy="100" r="84"/>
          </svg>
          <div class="gauge__center">
            <span class="gauge__value" id="total">0</span>
            <span class="gauge__max">DE 1000 PTS</span>
            <span class="level" id="level">—</span>
          </div>
        </div>
        <div>
          <span class="eyebrow">Recorrido completado</span>
          <h1 class="h1" id="res-title">¡Bien hecho!</h1>
          <p id="res-text"></p>
          <div class="res-hero__chips">
            <span class="chip">⏱ <span id="time">0:00</span></span>
            <span class="chip">🏅 <span id="ach-count">0</span> logros</span>
          </div>
        </div>
      </section>

      <div class="res-grid">
        <div>
          <section class="card res-card" aria-labelledby="bd-title">
            <h2 class="h3" id="bd-title">Puntaje por etapa</h2>
            <ul class="breakdown" id="breakdown"></ul>
          </section>
          <section class="card res-card" aria-labelledby="ach-title">
            <h2 class="h3" id="ach-title">Logros</h2>
            <div class="achievements" id="achievements"></div>
          </section>
        </div>
        <div>
          <section class="card res-card" aria-labelledby="cert-title">
            <h2 class="h3" id="cert-title">Tu certificado</h2>
            <div class="cert" id="cert">
              <img src="../assets/images/logo-sena.png" alt="SENA">
              <p class="cert__kicker">CERTIFICADO DE PARTICIPACIÓN</p>
              <p class="cert__name" id="cert-name"></p>
              <p class="cert__role" id="cert-role"></p>
              <p class="cert__text">Completó el recorrido <b>Zona Segura</b> de Seguridad y Salud en el Trabajo.</p>
              <p class="cert__score" id="cert-score"></p>
              <p class="cert__date" id="cert-date"></p>
            </div>
            <button class="btn btn--dark btn--block" type="button" id="btn-print" style="margin-top:14px">Imprimir o guardar en PDF</button>
          </section>
          <section class="card res-card" aria-labelledby="rank-title">
            <h2 class="h3" id="rank-title">Mejores puntajes en este equipo</h2>
            <ol class="ranking" id="ranking"></ol>
            <p class="muted" style="font-size:13px;margin-top:10px" id="rank-meta"></p>
          </section>
        </div>
      </div>

      <div class="res-actions">
        <button class="btn btn--primary btn--lg" type="button" id="btn-new">Siguiente participante</button>
        <a class="btn btn--ghost" href="../index.html">Ir al inicio</a>
      </div>
    </main>
  </div>

  <script src="../js/core.js"></script>
  <script src="../js/resultados.js"></script>
</body>
</html>
